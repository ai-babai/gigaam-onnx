name: Windows x64 Multi precision QA

on:
  push:
    branches: [qa/windows-multi-precision]
    paths: [.github/qa/windows-precision/model-lock.json]

permissions:
  contents: read

jobs:
  cpu-ort:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install CPU dependencies and run each pinned variant separately
        shell: pwsh
        run: |
          $lock = '.github/qa/windows-precision/model-lock.json'
          if (!(Test-Path $lock)) { throw 'Missing pinned model lock' }
          python -m pip install --disable-pip-version-check numpy==2.5.1 onnxruntime==1.23.2 sentencepiece==0.2.2 soundfile==0.13.1
          if ($LASTEXITCODE -ne 0) { throw 'CPU runtime installation failed' }
          $scratch = Join-Path $env:RUNNER_TEMP 'windows-multi-precision'
          python -B .github/qa/windows-precision/multi_precision.py run `
            --lock $lock --output precision-evidence --scratch $scratch 2>&1 |
            Tee-Object -FilePath precision-run.log
          if ($LASTEXITCODE -ne 0) { throw 'A precision variant failed; see evidence' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: windows-multi-precision
          path: |
            precision-evidence/
            precision-run.log
          retention-days: 3
          if-no-files-found: warn
